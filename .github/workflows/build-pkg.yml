# TEMPORARY verification workflow: builds and tests the Rust/WASM engine on
# GitHub's runners and pushes `pkg/` back so sandbox tests can run against it.
name: Build WASM package (verification)

on:
  push:
    branches:
      - arena/c7623e4e-8086-online-smart-compiler
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pkg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-verify2-${{ hashFiles('Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-verify2-
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Unit tests (parser/sema/exec)
        run: |
          set +e
          cargo test --lib 2>&1 | tee /tmp/cargo-test.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            sed -e 's/\x1b\[[0-9;]*m//g' /tmp/cargo-test.log | grep -E -A6 "error(\[|:)| --> " | head -60 | sed 's/^/::error::/'
            exit "$code"
          fi
      - name: Build WASM package
        run: |
          set +e
          wasm-pack build --release --target web --out-dir pkg 2>&1 | tee /tmp/wasmpack.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            sed -e 's/\x1b\[[0-9;]*m//g' /tmp/wasmpack.log | grep -E -A6 "error(\[|:)| --> " | head -60 | sed 's/^/::error::/'
            exit "$code"
          fi
      - name: Push generated package back to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f pkg
          if git diff --cached --quiet; then
            echo "pkg/ already up to date"
          else
            git commit -m "chore(verification): generated wasm package"
            git push origin HEAD
          fi
