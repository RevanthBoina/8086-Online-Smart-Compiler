# Continuous integration: Rust unit tests, WASM build, frontend tests and the
# Node verification suites. Publishes the generated `pkg/` as a workflow
# artifact for local verification - it is never committed back to Git.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-ci-${{ hashFiles('Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-ci-

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Rust unit tests (cargo test --lib)
        run: |
          set +e
          cargo test --lib 2>&1 | tee /tmp/cargo-test.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            grep -E "error(\[|:)" /tmp/cargo-test.log | head -50 | sed 's/^/::error::/'
            exit "$code"
          fi

      - name: Build WASM package (wasm-pack)
        run: |
          set +e
          wasm-pack build --release --target web --out-dir pkg 2>&1 | tee /tmp/wasmpack.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            grep -E "error(\[|:)" /tmp/wasmpack.log | head -50 | sed 's/^/::error::/'
            exit "$code"
          fi

      - name: Upload pkg artifact (never committed)
        uses: actions/upload-artifact@v4
        with:
          name: pkg
          path: pkg/
          retention-days: 14

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install webapp dependencies
        working-directory: webapp
        run: npm ci --legacy-peer-deps

      - name: Frontend tests (Jest, real engine)
        working-directory: webapp
        env:
          CI: true
        run: npx react-app-rewired test

      - name: Frontend production build
        working-directory: webapp
        env:
          CI: true
        run: npm run build

      - name: Engine regression suite (44 checks)
        run: node tests/engine.test.mjs

      - name: Intel/MASM acceptance suite
        run: node tests/intel8086.test.mjs

      - name: Static hosting / deep-link suite
        run: node tests/static.test.mjs
